{% if language_switch and language_switch.enabled %}
<div id="hippodec-language-switch" class="language-switch" role="group" aria-label="{{ language_switch.control_label }}" data-current="{{ language_switch.current }}" data-es-url="{{ language_switch.links.get('ES', '') }}" data-en-url="{{ language_switch.links.get('EN', '') }}">
  <button type="button" class="language-flag" data-language="ES" lang="es" aria-label="{{ language_switch.labels.get('ES', 'Español') }}" title="{{ language_switch.labels.get('ES', 'Español') }}" aria-pressed="{% if language_switch.current == 'ES' %}true{% else %}false{% endif %}"><svg class="language-flag-icon" viewBox="0 0 30 20" aria-hidden="true" focusable="false"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/><path d="M5 7h3v6H5z" fill="#aa151b"/><path d="M6 7h1v6H6z" fill="#f1bf00"/></svg></button>
  <button type="button" class="language-flag" data-language="EN" lang="en" aria-label="{{ language_switch.labels.get('EN', 'English') }}" title="{{ language_switch.labels.get('EN', 'English') }}" aria-pressed="{% if language_switch.current == 'EN' %}true{% else %}false{% endif %}"><svg class="language-flag-icon" viewBox="0 0 30 20" aria-hidden="true" focusable="false"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="1.6"/><path d="M15 0v20M0 10h30" stroke="#fff" stroke-width="7"/><path d="M15 0v20M0 10h30" stroke="#c8102e" stroke-width="3.3"/></svg></button>
</div>
{% endif %}
